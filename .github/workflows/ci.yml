name: SmartLearn CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize and Seed Test Database
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///backend/smartlearn.db
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from database import engine, Base, SessionLocal; from seed.seed_data import seed_database; Base.metadata.create_all(bind=engine); db = SessionLocal(); seed_database(db); db.close()"

      - name: Run Backend Regression Test Suites
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///backend/smartlearn.db
        run: |
          python scratch/test_phase7_master_e2e_validation.py
          python scratch/test_phase6_production_hardening.py
          python scratch/test_phase5g_cognitive_diagnosis.py
          python scratch/test_phase5f_progress_analytics.py
          python scratch/test_phase5e_closed_loop.py
          python scratch/test_phase5d_personalized_learning.py
          python scratch/test_phase5c_material_quiz.py
          python scratch/test_phase5b_study_content.py
          python scratch/test_phase5a_material_foundation.py
          python scratch/test_phase4_results_and_review.py
          python scratch/test_phase3_learner_assessment.py
          python scratch/test_phase2_governance.py
          python backend/test_role_workflow.py
          python backend/test_permissions_and_practice.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend TypeScript check and Vite build
        run: |
          cd frontend
          npm run build
